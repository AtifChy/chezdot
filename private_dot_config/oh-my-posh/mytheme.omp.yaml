# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 3
final_space: true

blocks:
  - type: prompt
    alignment: left
    segments:
      - type: session
        style: plain
        foreground: white
        template: "{{ if .SSHSession }}󱘖 <b><blue>{{ .UserName }}@{{ .HostName }}</></b> in {{ end }}"

      - type: path
        style: plain
        foreground: cyan
        template: "\
          {{ if .Root }}<red>󰒘</> {{ end }}\
          {{ if not .Writable }}<red> </>{{ else }}<cyan> </>{{ end }}\
          {{ .Path }} "
        properties:
          edge_format: "<b>%s</b>"
          # folder_icon: …
          # max_depth: 3
          max_width: 30
          # style: agnoster_short
          style: powerlevel

      - type: git
        style: plain
        foreground: white
        template: "\
          on <b><magenta>{{ .HEAD }}</> \
          {{ if .Working }}<darkGray>[{{ end }}\
          {{ if .BranchStatus }}<red>{{ .BranchStatus }}</>{{ end }}\
          {{ if .Working.Changed }}|{{ end }}\
          <yellow>{{ nospace .Working.String }}</>\
          {{ if .Staging.Changed }}|{{ end }}\
          <green>{{ nospace .Staging.String }}</>\
          {{ if gt .StashCount 0 }}|<blue>${{ .StashCount }}</>{{ end }}\
          {{ if .Working }}]</>{{ end }}</b> "
        properties:
          branch_icon: " "
          commit_icon: " "
          tag_icon: " "
          rebase_icon: " "
          cherry_pick_icon: " "
          revert_icon: " "
          merge_icon: " "
          no_commits_icon: "󰂕 "
          fetch_stash_count: true
          fetch_status: true
          fetch_upstream_icon: true
          status_formats:
            Added: +%d
            Deleted: -%d
            Modified: ~%d
            Untracked: ?%d
            Unmerged: ×%d

      - type: python
        style: plain
        foreground: white
        template: "via <lightYellow> <b>{{ .Full }}</b></> "

      - type: executiontime
        style: plain
        foreground: white
        template: "took <b><yellow>{{ nospace .FormattedMs }}</> "
        properties:
          style: round
          threshold: 5000

      - type: status
        style: plain
        foreground: red
        template: "{{ if eq .Code 0 }}✔{{ else }} {{ reason .Code }}{{ end }}"

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: status
        style: plain
        template: ➜
        properties:
          always_enabled: true
        foreground_templates:
          - "{{ if gt .Code 0 }}red{{ else }}green{{ end }}"
