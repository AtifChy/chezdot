$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 3
final_space: true
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: session
        style: plain
        foreground: white
        template: "\
          {{ if .SSHSession }}󱘖 <b><blue>{{ .UserName }}@{{ .HostName }}</></b> in {{ end }}\
          {{ if .Root }}<red>󰒘</> {{ end }}"

      - type: path
        style: plain
        foreground_templates:
          - "{{ if not .Writable }}red{{ else }}cyan{{ end }}"
        template: " {{ .Path }} "
        properties:
          edge_format: "<b>%s</b>"
          # folder_icon: …
          # max_depth: 3
          max_width: 30
          # style: agnoster_short
          style: powerlevel
          windows_registry_icon: " "

      - type: git
        style: plain
        foreground: white
        template: "\
          on <b><magenta>{{ .HEAD }}</> \
          {{ if .Working }}<darkGray>[{{ end }}\
          {{ if .BranchStatus }}<blue>{{ .BranchStatus }}</>{{ end }}\
          {{ if .Working.Changed }}|{{ end }}\
          {{ nospace .Working.String }}\
          {{ if .Staging.Changed }}|{{ end }}\
          {{ nospace .Staging.String }}\
          {{ if gt .StashCount 0 }}|<cyan>${{ .StashCount }}</>{{ end }}\
          {{ if .Working }}]</>{{ end }}</b> "
        properties:
          fetch_stash_count: true
          fetch_status: true
          fetch_upstream_icon: true
          status_formats:
            Added: <green>+%d</>
            Deleted: <red>-%d</>
            Modified: <yellow>~%d</>
            Untracked: <yellow>?%d</>
            Unmerged: <red>x%d</>

      - type: executiontime
        style: plain
        foreground: white
        template: "took <b><yellow>{{ nospace .FormattedMs }}</> "
        properties:
          style: round
          threshold: 5000

      - type: status
        style: plain
        foreground: red
        template: "{{ if eq .Code 0 }}✔{{ else }} {{ reason .Code }}{{ end }}"

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: status
        style: powerline
        template: ➜
        properties:
          always_enabled: true
        foreground_templates:
          - "{{ if gt .Code 0 }}red{{ else }}green{{ end }}"
