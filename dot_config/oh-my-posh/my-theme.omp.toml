"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"

final_space = true
shell_integration = true
version = 3

[transient_prompt]
template = '➜ '
foreground = 'green'
background = 'transparent'
foreground_templates = ['{{ if gt .Code 0 }}red{{ end }}']

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = '{{ if .Root }}<red>󰒘</> {{end}}{{ if .SSHSession }} <b><cyan>{{ .UserName }}@{{ .HostName }}</> in {{ end }}'
foreground = 'white'
type = 'session'
style = 'plain'

[[blocks.segments]]
template = ' <b>{{ .Path }}</b> '
type = 'path'
style = 'plain'
foreground_templates = ['{{ if not .Writable }}red{{ else }}blue{{ end }}']

[blocks.segments.properties]
folder_icon = '…'
max_depth = 3
style = 'agnoster_short'
windows_registry_icon = ' '

[[blocks.segments]]
template = 'on <b><magenta>{{ .HEAD }} </>{{ if .Working }}<b><black>[{{ end }}<cyan>{{ if gt .Ahead 0 }}↑{{ .Ahead }}{{ end }}{{ if gt .Behind 0 }}↓{{ .Behind }}{{ end }}{{ if and (eq .Ahead 0) (eq .Behind 0) .BranchStatus }}{{ .BranchStatus }}{{ end }}</>{{ if .Working.Changed }} <red>{{ nospace .Working.String }}</>{{ end }}{{ if .Staging.Changed }} <green>{{ nospace .Staging.String }}</>{{ end }}{{ if gt .StashCount 0 }} <yellow>${{ .StashCount }}</>{{ end }}{{ if .Working }}]</>{{ end }} '
foreground = 'white'
type = 'git'
style = 'plain'

[blocks.segments.properties]
fetch_stash_count = true
fetch_status = true
fetch_upstream_icon = true

[[blocks.segments]]
template = 'via <lightCyan> <b>{{ .Full }}</b></> '
foreground = 'white'
type = 'go'
style = 'plain'

[[blocks.segments]]
template = 'via <green> <b>{{ .Full }}</b></> '
foreground = 'white'
type = 'node'
style = 'plain'

[[blocks.segments]]
template = 'via <lightYellow> <b>{{ .Full }}</b></> '
foreground = 'white'
type = 'python'
style = 'plain'

[[blocks.segments]]
template = 'took <b><yellow>{{ nospace .FormattedMs }}</> '
foreground = 'white'
type = 'executiontime'
style = 'plain'

[blocks.segments.properties]
style = 'round'
threshold = 5000

[[blocks.segments]]
template = '{{ if eq .Code 0 }}✔{{ else }} {{ reason .Code }}{{ end }}'
foreground = 'red'
type = 'status'
style = 'plain'

[[blocks]]
type = 'prompt'
alignment = 'right'

[[blocks.segments]]
template = ' <b>{{ .Shell }}</b>'
foreground = 'cyan'
type = 'text'
style = 'plain'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = '➜'
foreground = 'green'
type = 'status'
style = 'powerline'
foreground_templates = ['{{ if gt .Code 0 }}red{{ end }}']

[blocks.segments.properties]
always_enabled = true
