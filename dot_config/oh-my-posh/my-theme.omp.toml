"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"

final_space = true
shell_integration = true
version = 3

# [transient_prompt]
# template = '➜ '
# foreground = 'green'
# background = 'transparent'
# foreground_templates = ['{{ if gt .Code 0 }}red{{ end }}']

[[blocks]]
type = 'prompt'
alignment = 'left'
# newline = true

[[blocks.segments]]
type = 'session'
style = 'plain'
foreground = 'white'
template = """
{{ if .Root }}<red>󰒘</> {{end}}\
{{ if .SSHSession }} <b><cyan>{{ .UserName }}@{{ .HostName }}</> in {{ end }}\
"""

[[blocks.segments]]
type = 'path'
style = 'plain'
template = ' <b>{{ .Path }}</b> '
foreground_templates = ['{{ if not .Writable }}red{{ else }}blue{{ end }}']

[blocks.segments.properties]
style = 'agnoster_short'
folder_icon = '…'
max_depth = 3
windows_registry_icon = ' '

[[blocks.segments]]
type = 'git'
style = 'plain'
foreground = 'white'
template = """
on <b><magenta>{{ .HEAD }} </>\
{{ if .Working }}<b><black>[{{ end }}\
<cyan>\
{{ if gt .Ahead 0 }}↑{{ .Ahead }}{{ end }}\
{{ if gt .Behind 0 }}↓{{ .Behind }}{{ end }}\
{{ if and (eq .Ahead 0) (eq .Behind 0) .BranchStatus }}{{ .BranchStatus }}{{ end }}\
</>\
{{ if .Working.Changed }} <red>{{ nospace .Working.String }}</>{{ end }}\
{{ if .Staging.Changed }} <green>{{ nospace .Staging.String }}</>{{ end }}\
{{ if gt .StashCount 0 }} <yellow>${{ .StashCount }}</>{{ end }}{{ if .Working }}]</>{{ end }} \
"""

[blocks.segments.properties]
fetch_stash_count = true
fetch_status = true
fetch_upstream_icon = true
branch_icon = ' '
commit_icon = ' '
tag_icon = ' '
rebase_icon = ' '
cherry_pick_icon = ' '
revert_icon = ' '
merge_icon = ' '
no_commit_icon = '󰂕 '

[[blocks.segments]]
type = 'go'
style = 'plain'
foreground = 'white'
template = '{{ if .Full }}via <lightCyan> <b>{{ .Full }}</b></> {{ end }}'

[[blocks.segments]]
type = 'node'
style = 'plain'
foreground = 'white'
template = '{{ if .Full }}via <green> <b>{{ .Full }}</b></> {{ end }}'

[[blocks.segments]]
type = 'python'
style = 'plain'
foreground = 'white'
template = '{{ if .Full }}via <lightYellow> <b>{{ .Full }}</b></> {{ end }}'

[[blocks.segments]]
type = 'rust'
style = 'plain'
foreground = 'white'
template = '{{ if .Full }}via <lightRed> <b>{{ .Full }}</b></> {{ end }}'

[[blocks.segments]]
type = 'lua'
style = 'plain'
foreground = 'white'
template = '{{ if .Full }}via <lightBlue> <b>{{ .Full }}</b></> {{ end }}'

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'white'
template = 'took <b><yellow>{{ nospace .FormattedMs }}</> '

[blocks.segments.properties]
style = 'round'
threshold = 5000

[[blocks.segments]]
type = 'status'
style = 'plain'
foreground = 'red'
template = '{{ if eq .Code 0 }}✔{{ else }} {{ reason .Code }}{{ end }}'

[[blocks]]
type = 'prompt'
alignment = 'right'
overflow = 'hide'

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground = 'cyan'
template = ' <b>{{ .Shell }}</b>'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
template = '➜'
foreground = 'green'
type = 'status'
style = 'powerline'
foreground_templates = ['{{ if gt .Code 0 }}red{{ end }}']

[blocks.segments.properties]
always_enabled = true
